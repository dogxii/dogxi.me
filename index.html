<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dogxi — curious developer." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Dogxi - Rookie Dog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      /* ── Reset ── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Tokens ── */
      :root {
        --bg:             #ffffff;
        --surface:        #f5f5f5;
        --surface-active: #e8e8e8;
        --border:         #e5e5e5;
        --text:           #171717;
        --text-2:         #6b6b6b;
        --text-3:         #b0b0b0;
        --radius:         14px;
        --dur:            0.14s;
      }

      html.dark {
        --bg:             #0f0f0f;
        --surface:        #1c1c1c;
        --surface-active: #262626;
        --border:         #2e2e2e;
        --text:           #f5f5f5;
        --text-2:         #999999;
        --text-3:         #4a4a4a;
      }

      /* ── Base ── */
      html {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* smooth theme transitions */
        transition: background var(--dur) ease, color var(--dur) ease;
      }

      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* safe area for notched phones */
        padding: max(2.5rem, env(safe-area-inset-top))
                 max(1.25rem, env(safe-area-inset-right))
                 max(2.5rem, env(safe-area-inset-bottom))
                 max(1.25rem, env(safe-area-inset-left));
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Theme button ── */
      #theme-btn {
        position: fixed;
        top: max(1.1rem, env(safe-area-inset-top));
        right: max(1.1rem, env(safe-area-inset-right));
        z-index: 10;
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text-2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
        transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease;
        -webkit-tap-highlight-color: transparent;
      }

      #theme-btn:active {
        background: var(--surface-active);
      }

      @media (hover: hover) {
        #theme-btn:hover {
          background: var(--surface-active);
          color: var(--text);
        }
      }

      /* ── Wrapper ── */
      .wrap {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.25rem;
      }

      /* ── Profile ── */
      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        text-align: center;
      }

      .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        object-fit: cover;
        display: block;
        /* prevent layout shift */
        aspect-ratio: 1;
        transition: border-color var(--dur) ease;
      }

      .name {
        font-size: 1.2rem;
        font-weight: 500;
        letter-spacing: -0.025em;
        color: var(--text);
      }

      .tagline {
        font-size: 0.9rem;
        color: var(--text-2);
        line-height: 1.55;
        max-width: 26ch;
        transition: color var(--dur) ease;
      }

      /* ── Links list ── */
      .links {
        width: 100%;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .links a {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        /* generous touch target */
        min-height: 58px;
        padding: 0 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        text-decoration: none;
        touch-action: manipulation;
        transition: background var(--dur) ease, border-color var(--dur) ease;
        -webkit-tap-highlight-color: transparent;
        /* prevent text selection on fast taps */
        user-select: none;
        -webkit-user-select: none;
      }

      .links a:active {
        background: var(--surface-active);
      }

      @media (hover: hover) {
        .links a:hover {
          background: var(--surface-active);
          border-color: var(--text-3);
        }

        .links a:hover .arrow {
          color: var(--text-2);
          transform: translate(2px, -2px);
        }
      }

      /* ── Link icon box ── */
      .icon-box {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-2);
        transition: border-color var(--dur) ease, background var(--dur) ease;
      }

      /* ── Link text ── */
      .link-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
      }

      .link-title {
        font-size: 0.925rem;
        font-weight: 500;
        color: var(--text);
        line-height: 1.3;
      }

      .link-sub {
        font-size: 0.8rem;
        color: var(--text-2);
        line-height: 1.3;
        /* truncate if too long */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color var(--dur) ease;
      }

      /* ── Arrow ── */
      .arrow {
        flex-shrink: 0;
        color: var(--text-3);
        transition: color var(--dur) ease, transform 0.12s ease;
      }

      /* ── Footer ── */
      .foot {
        font-size: 0.75rem;
        color: var(--text-3);
        transition: color var(--dur) ease;
      }

      /* ── Entry animation ── */
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .wrap {
        animation: rise 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .wrap { animation: none; }
        .links a,
        .arrow,
        #theme-btn { transition: none; }
      }
    </style>
  </head>

  <body>
    <!-- Theme toggle -->
    <button id="theme-btn" aria-label="Toggle dark mode" type="button">
      <svg id="sun" width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" style="display:none">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1"     x2="12" y2="3"/>
        <line x1="12" y1="21"    x2="12" y2="23"/>
        <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1"  y1="12"    x2="3"  y2="12"/>
        <line x1="21" y1="12"    x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
      </svg>
      <svg id="moon" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <div class="wrap">
      <!-- Profile -->
      <div class="profile">
        <img
          class="avatar"
          src="https://avatars.githubusercontent.com/u/106546046?s=96&v=4"
          alt="Dogxi avatar"
          width="72"
          height="72"
          loading="eager"
          decoding="async"
        />
        <h1 class="name">Dogxi</h1>
        <p class="tagline">Rookie Dog.</p>
      </div>

      <!-- Nav links -->
      <ul class="links" role="list">
        <li>
          <a href="https://blog.dogxi.me" target="_blank" rel="noopener noreferrer">
            <span class="icon-box" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 19.5A2.5 2.5 0 0 1 4.5 17H20"/>
                <path d="M4.5 2H20v20H4.5A2.5 2.5 0 0 1 2 19.5v-15A2.5 2.5 0 0 1 4.5 2z"/>
              </svg>
            </span>
            <span class="link-text">
              <span class="link-title">Blog</span>
              <span class="link-sub">blog.dogxi.me</span>
            </span>
            <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <line x1="7" y1="17" x2="17" y2="7"/>
              <polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
        </li>

        <li>
          <a href="https://github.com/dogxii" target="_blank" rel="noopener noreferrer">
            <span class="icon-box" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207
                         11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416
                         -4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083
                         -.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834
                         2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305
                         -5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124
                         -.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266
                         1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552
                         3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235
                         1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823
                         1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199
                         -6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </span>
            <span class="link-text">
              <span class="link-title">GitHub</span>
              <span class="link-sub">github.com/dogxii</span>
            </span>
            <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <line x1="7" y1="17" x2="17" y2="7"/>
              <polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
        </li>

        <li>
          <a href="https://i.dogxi.me" target="_blank" rel="noopener noreferrer">
            <span class="icon-box" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3a15 15 0 0 1 0 18"/>
                <path d="M12 3a15 15 0 0 0 0 18"/>
              </svg>
            </span>
            <span class="link-text">
              <span class="link-title">iWeb</span>
              <span class="link-sub">i.dogxi.me</span>
            </span>
            <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <line x1="7" y1="17" x2="17" y2="7"/>
              <polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
        </li>

        <li>
          <a href="mailto:hi@dogxi.me">
            <span class="icon-box" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                   stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <polyline points="2,4 12,13 22,4"/>
              </svg>
            </span>
            <span class="link-text">
              <span class="link-title">Email</span>
              <span class="link-sub">hi@dogxi.me</span>
            </span>
            <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <line x1="7" y1="17" x2="17" y2="7"/>
              <polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
        </li>
      </ul>

      <p class="foot">&copy; 2026 Dogxi</p>
    </div>

    <script>
      var btn  = document.getElementById("theme-btn");
      var sun  = document.getElementById("sun");
      var moon = document.getElementById("moon");
      var html = document.documentElement;

      function sync() {
        var dark = html.classList.contains("dark");
        sun.style.display  = dark ? "block" : "none";
        moon.style.display = dark ? "none"  : "block";
      }

      sync();

      btn.addEventListener("click", function () {
        var dark = html.classList.toggle("dark");
        localStorage.setItem("theme", dark ? "dark" : "light");
        sync();
      });
    </script>
  </body>
</html>
